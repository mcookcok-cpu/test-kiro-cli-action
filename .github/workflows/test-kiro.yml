name: Test Kiro CLI with Copilot

on:
  workflow_dispatch:

jobs:
  test-copilot:
    runs-on: ubuntu-latest
    steps:
      - name: Install Kiro CLI
        run: |
          curl -fsSL https://cli.kiro.dev/install | bash

      - name: Check All Help & Model Options
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          kiro-cli --help-all || true
          kiro-cli chat --help || true
