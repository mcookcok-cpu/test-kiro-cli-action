name: Test Kiro CLI Model and Chat

on:
  workflow_dispatch:

jobs:
  test-model:
    runs-on: ubuntu-latest
    steps:
      - name: Install Kiro CLI
        run: |
          curl -fsSL https://cli.kiro.dev/install | bash

      - name: Check Chat Help & Models
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          kiro-cli chat --help || true
          # Cek jika ada subcommand model atau opsi model
          kiro-cli chat --model "" || true
