name: Test Kiro CLI Model and Chat

on:
  workflow_dispatch:

jobs:
  test-model:
    runs-on: ubuntu-latest
    steps:
      - name: Install Kiro CLI
        run: |
          curl -fsSL https://cli.kiro.dev/install | bash

      - name: Test Chat Command with Input
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Coba jalankan non-interaktif dengan input string (atau cek help agent/model)
          kiro-cli chat "Hello, what model are you using?" || true
          kiro-cli agent --help || true
